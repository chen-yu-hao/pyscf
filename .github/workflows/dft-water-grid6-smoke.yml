name: DFT water grid6 smoke benchmark

on:
  push:
    branches: [perf/dft-h2o-grid6-smoke-20261029]
    paths:
      - 'benchmarks/dft_water_grid6.py'
      - '.github/workflows/dft-water-grid6-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  water-grid6:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYSCF_NUMA: 'off'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran cmake libblas-dev liblapack-dev libopenblas-dev numactl
      - name: Python and native build
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" scipy h5py threadpoolctl wheel cmake pytest
          python -m pip install --no-build-isolation -e .
      - name: Focused tests of changed numerical code
        run: |
          python -m pytest -q pyscf/dft/test/test_numint_rho_fused.py pyscf/dft/test/test_numint_mgga_vmat.py pyscf/dft/test/test_numint_cache_blocks.py pyscf/dft/test/test_numa.py
      - name: DFT grid6 PBE smoke test
        run: |
          python benchmarks/dft_water_grid6.py --sizes 1 2 4 --xc PBE --threads 2 --output benchmark-pbe.json
      - name: DFT grid6 MN15 smoke test
        run: |
          python benchmarks/dft_water_grid6.py --sizes 1 2 --xc MN15 --threads 2 --output benchmark-mn15.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dft-water-grid6-results
          path: benchmark-*.json
          if-no-files-found: ignore
