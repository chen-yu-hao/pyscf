name: DFT grid6 verified benchmark

'on':
  push:
    branches: [master]
    paths: ['.github/workflows/dft-benchmark-launch.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dft-grid6-verified
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: '4580f1f472b518cf4540c79634791847c721a37b'
      BASELINE_SHA: '3a6238ea20a467eabaf6290e0f23de2ea23460ec'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_MAX_ACTIVE_LEVELS: '1'
      OMP_DYNAMIC: 'FALSE'
      PYSCF_NUMA: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4580f1f472b518cf4540c79634791847c721a37b'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare environment
        run: |
          mkdir -p benchmark-results
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran libopenblas-dev liblapack-dev numactl
          python -m pip install 'cmake>=3.22,<4' 'numpy<3' scipy h5py threadpoolctl pytest setuptools wheel
          python -m pip freeze > benchmark-results/python-packages.txt
          lscpu > benchmark-results/cpu.txt
          numactl --hardware > benchmark-results/numa.txt
          gcc --version > benchmark-results/compiler.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Build exact candidate and baseline
        run: |
          cmake -S pyscf/lib -B build-native -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE='-O2 -DNDEBUG -fno-fast-math' \
            -DBLA_VENDOR=OpenBLAS -DENABLE_XCFUN=OFF 2>&1 | tee benchmark-results/configure-candidate.log
          cmake --build build-native --parallel 3 2>&1 | tee benchmark-results/build-candidate.log
          base="$RUNNER_TEMP/pyscf-dft-baseline"
          git worktree add --detach "$base" "$BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/pyscf/lib/deps" "$base/pyscf/lib/deps"
          cmake -S "$base/pyscf/lib" -B "$base/build-native" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE='-O2 -DNDEBUG -fno-fast-math' \
            -DBLA_VENDOR=OpenBLAS -DENABLE_XCFUN=OFF -DBUILD_LIBCINT=OFF -DBUILD_LIBXC=OFF -DBUILD_XCFUN=OFF \
            2>&1 | tee benchmark-results/configure-baseline.log
          cmake --build "$base/build-native" --parallel 3 2>&1 | tee benchmark-results/build-baseline.log
          echo "BASELINE_ROOT=$base" >> "$GITHUB_ENV"
          ldd pyscf/lib/libdft.so > benchmark-results/ldd-candidate.txt
          ldd "$base/pyscf/lib/libdft.so" > benchmark-results/ldd-baseline.txt
      - name: First complete molecular SCFs
        run: |
          python benchmarks/dft_water_grid6.py --baseline-root "$BASELINE_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" --sizes 1 --xc PBE MN15 --threads 2 \
            --repeat 1 --profile --numa off --output benchmark-results/smoke \
            2>&1 | tee benchmark-results/smoke.log
      - name: Native numerical and worker regression
        run: |
          python pyscf/dft/test/test_numa_payload.py -v 2>&1 | tee benchmark-results/payload.log
          python benchmarks/test_dft_water_grid6.py -v 2>&1 | tee benchmark-results/harness.log
          for flag in 0 1; do
            PYSCF_DFT_VMAT_TILE_SCREEN="$flag" python -m pytest -q \
              pyscf/dft/test/test_numint_rho_fused.py pyscf/dft/test/test_numint_mgga_vmat.py \
              pyscf/dft/test/test_numint_cache_blocks.py pyscf/dft/test/test_numa.py \
              pyscf/dft/test/test_numa_process.py \
              2>&1 | tee "benchmark-results/regression-$flag.log"
          done
      - name: Full paired molecular timing matrix
        run: |
          python benchmarks/dft_water_grid6.py --baseline-root "$BASELINE_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" --sizes 1 2 4 --xc PBE MN15 --threads 1 2 4 \
            --repeat 3 --profile --numa off --output benchmark-results/full \
            2>&1 | tee benchmark-results/full.log
      - name: Publish result files even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dft-grid6-verified-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: warn
