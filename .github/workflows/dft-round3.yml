name: DFT round3 MGGA and direct JK ablations

'on':
  push:
    branches: [perf/dft-round3-mgga-jk-20261030]
    paths: ['.github/workflows/dft-round3.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dft-round3-verified
  cancel-in-progress: false

defaults:
  run:
    shell: bash
jobs:
  molecular-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: 'a36f5296a971a59527cc22a5ca5d1a1629e2c3b2'
      BASELINE_SHA: '5060bd524fa5e15ad0408fc80ddb3bc3d5cc6130'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      OMP_MAX_ACTIVE_LEVELS: '1'
      OMP_DYNAMIC: 'FALSE'
      PYSCF_NUMA: 'off'
      PYSCF_DFT_DENSE_BLAS: '1'
      PYSCF_DFT_VMAT_TILE_SCREEN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a36f5296a971a59527cc22a5ca5d1a1629e2c3b2'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record environment and install dependencies
        run: |
          mkdir -p benchmark-results
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran libopenblas-dev liblapack-dev numactl
          python -m pip install 'cmake>=3.22,<4' 'numpy<3' scipy h5py threadpoolctl pytest setuptools wheel
          python -m pip freeze > benchmark-results/python-packages.txt
          lscpu > benchmark-results/cpu.txt
          numactl --hardware > benchmark-results/numa.txt
          gcc --version > benchmark-results/compiler.txt
          git rev-parse HEAD > benchmark-results/candidate-sha.txt
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Build pinned candidate and round-two baseline
        run: |
          cmake -S pyscf/lib -B build-native -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE='-O2 -DNDEBUG -fno-fast-math' \
            -DBLA_VENDOR=OpenBLAS -DENABLE_XCFUN=OFF 2>&1 | tee benchmark-results/configure-candidate.log
          cmake --build build-native --parallel 3 2>&1 | tee benchmark-results/build-candidate.log
          base="$RUNNER_TEMP/pyscf-round2-baseline"
          git worktree add --detach "$base" "$BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/pyscf/lib/deps" "$base/pyscf/lib/deps"
          cmake -S "$base/pyscf/lib" -B "$base/build-native" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE='-O2 -DNDEBUG -fno-fast-math' \
            -DBLA_VENDOR=OpenBLAS -DENABLE_XCFUN=OFF -DBUILD_LIBCINT=OFF -DBUILD_LIBXC=OFF -DBUILD_XCFUN=OFF \
            2>&1 | tee benchmark-results/configure-baseline.log
          cmake --build "$base/build-native" --parallel 3 2>&1 | tee benchmark-results/build-baseline.log
          echo "BASELINE_ROOT=$base" >> "$GITHUB_ENV"
          ldd pyscf/lib/libdft.so > benchmark-results/ldd-dft.txt
          ldd pyscf/lib/libcvhf.so > benchmark-results/ldd-vhf.txt
      - name: Native MGGA and direct-JK regression
        run: |
          python -m pytest -q pyscf/dft/test/test_round3.py 2>&1 | tee benchmark-results/round3-native.log
          for flag in 0 1; do
            PYSCF_DFT_MGGA_PACK_SIMD="$flag" PYSCF_JK_BLOCK_BOUND="$flag" python -m pytest -q \
              pyscf/dft/test/test_numint_mgga_vmat.py pyscf/dft/test/test_numint_dense_blas.py \
              pyscf/dft/test/test_numint_rho_fused.py pyscf/dft/test/test_numint_cache_blocks.py \
              pyscf/dft/test/test_numa.py pyscf/dft/test/test_numa_process.py \
              2>&1 | tee "benchmark-results/regression-$flag.log"
          done
          PYSCF_JK_BLOCK_BOUND=1 python -m pytest -q pyscf/scf/test/test_jk.py \
            2>&1 | tee benchmark-results/jk-regression.log
      - name: Early MN15 smoke
        run: |
          python benchmarks/dft_round3.py --component both --baseline-root "$BASELINE_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" --sizes 1 4 --xc MN15 --threads 2 \
            --repeat 1 --profile --numa off --output benchmark-results/smoke \
            2>&1 | tee benchmark-results/smoke.log
      - name: Upload early smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: dft-round3-smoke-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 14
      - name: Isolate MGGA packing
        run: |
          python benchmarks/dft_round3.py --component mgga --baseline-root "$BASELINE_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" --sizes 1 2 4 --xc MN15 --threads 2 \
            --repeat 3 --profile --numa off --output benchmark-results/mgga \
            2>&1 | tee benchmark-results/mgga.log
      - name: Combined full grid6 matrix
        run: |
          python benchmarks/dft_round3.py --component both --baseline-root "$BASELINE_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" --sizes 1 2 4 --xc PBE MN15 --threads 1 2 4 \
            --repeat 3 --profile --numa off --output benchmark-results/full \
            2>&1 | tee benchmark-results/full.log
      - name: Upload completed standard-size evidence
        uses: actions/upload-artifact@v4
        with:
          name: dft-round3-standard-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 14
      - name: Isolate direct J/K including eight waters
        run: |
          python benchmarks/dft_round3.py --component jk --baseline-root "$BASELINE_ROOT" \
            --candidate-root "$GITHUB_WORKSPACE" --sizes 4 8 --xc MN15 --threads 2 \
            --repeat 3 --profile --numa off --timeout 3600 --output benchmark-results/jk \
            2>&1 | tee benchmark-results/jk.log
      - name: Audit all 23 cases and 184 converged verified records
        run: |
          python benchmarks/accept_round3.py benchmark-results --candidate "$CANDIDATE_SHA" \
            2>&1 | tee benchmark-results/acceptance.log
      - name: Upload all results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dft-round3-results-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: warn
